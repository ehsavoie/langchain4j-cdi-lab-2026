<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 755"
     style="font-family:'JetBrains Mono',Consolas,'Courier New',monospace">

  <!-- ── Background ── -->
  <rect width="860" height="755" rx="10" fill="#0d1117"/>

  <!-- ── Title ── -->
  <text x="430" y="28" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700">AgenticScope — évolution du pipeline (demo-6)</text>

  <!-- ── Column headers ── -->
  <text x="205" y="48" text-anchor="middle" fill="#6e7681" font-size="10" letter-spacing="1">PIPELINE</text>
  <text x="635" y="48" text-anchor="middle" fill="#6e7681" font-size="10" letter-spacing="1">AGENTIC SCOPE</text>

  <!-- ── Column divider ── -->
  <line x1="408" y1="38" x2="408" y2="740" stroke="#21262d" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- INITIAL STATE                                    -->
  <!-- ════════════════════════════════════════════════ -->
  <text x="205" y="76" text-anchor="middle" fill="#6e7681" font-size="11" font-style="italic">état initial</text>
  <!-- scope["style"] is written when writeStoryWithStyle(@V("style") ...) is called -->
  <rect x="418" y="60" width="428" height="28" rx="4" fill="#161b22"/>
  <text x="434" y="79" fill="#6e7681" font-size="11">style : "Viking"   story : <tspan font-style="italic">∅</tspan>   score : <tspan font-style="italic">∅</tspan></text>

  <!-- ↓ arrow -->
  <line x1="408" y1="90" x2="408" y2="103" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="408,111 403,102 413,102" fill="#30363d"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- SEQUENCE container                               -->
  <!-- ════════════════════════════════════════════════ -->
  <rect x="12" y="110" width="382" height="496" rx="6" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="124" fill="#6e7681" font-size="9" letter-spacing="1">SÉQUENCE</text>

  <!-- ── A2ACreativeWriter ── -->
  <rect x="24" y="128" width="358" height="46" rx="5" fill="#1c2128" stroke="#ff6b3544" stroke-width="1"/>
  <rect x="24" y="128" width="5"   height="46" rx="2" fill="#ff6b35"/>
  <text x="42"  y="147" fill="#ff6b35" font-size="11" font-weight="600">A2ACreativeWriter</text>
  <text x="42"  y="165" fill="#8b949e" font-size="10">outputKey = "story"</text>

  <rect x="418" y="128" width="428" height="46" rx="4" fill="#1c2128" stroke="#ff6b3522" stroke-width="1"/>
  <rect x="418" y="128" width="5"   height="46" rx="2" fill="#ff6b35"/>
  <text x="436" y="147" fill="#ff6b35" font-size="11" font-weight="600">story : "Sigurd navigua vers l'horizon…"</text>
  <text x="436" y="165" fill="#6e7681" font-size="11">score : <tspan font-style="italic">∅</tspan></text>

  <!-- ↓ arrow -->
  <line x1="408" y1="176" x2="408" y2="188" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="408,196 403,187 413,187" fill="#30363d"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- SUPERVISOR container                             -->
  <!-- ════════════════════════════════════════════════ -->
  <rect x="22" y="197" width="360" height="360" rx="5" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="34" y="211" fill="#6e7681" font-size="9" letter-spacing="1">SUPERVISEUR</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- @SupervisorRequest PLANNER — reads scope to build the LLM user request -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <rect x="34" y="215" width="336" height="52" rx="5" fill="#1c2128" stroke="#a371f755" stroke-width="1"/>
  <rect x="34" y="215" width="5"   height="52" rx="2" fill="#a371f7"/>
  <text x="52"  y="234" fill="#a371f7" font-size="11" font-weight="600">Planificateur LLM  (@SupervisorRequest)</text>
  <text x="52"  y="253" fill="#8b949e" font-size="10">lit scope["story"] + scope["style"] → requête LLM</text>

  <rect x="418" y="215" width="428" height="52" rx="4" fill="#1c2128" stroke="#a371f722" stroke-width="1"/>
  <rect x="418" y="215" width="5"   height="52" rx="2" fill="#a371f7"/>
  <text x="436" y="234" fill="#8b949e" font-size="11">reads scope["story"] + scope["style"] = "Viking"</text>
  <text x="436" y="253" fill="#a371f7" font-size="10" font-weight="600">→ "Evaluate for 'Viking' style: Sigurd navigua…"</text>

  <!-- ↓ arrow (planner → style-scorer) -->
  <line x1="408" y1="269" x2="408" y2="281" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="408,289 403,280 413,280" fill="#30363d"/>

  <!-- ── style-scorer tour 1 ── -->
  <rect x="34" y="290" width="336" height="46" rx="5" fill="#1c2128" stroke="#58a6ff44" stroke-width="1"/>
  <rect x="34" y="290" width="5"   height="46" rx="2" fill="#58a6ff"/>
  <text x="52"  y="309" fill="#58a6ff" font-size="11" font-weight="600">style-scorer  (tour 1)</text>
  <text x="52"  y="327" fill="#8b949e" font-size="10">outputKey = "score"  — lit scope["story"] + scope["style"]</text>

  <rect x="418" y="290" width="428" height="46" rx="4" fill="#1c2128" stroke="#58a6ff22" stroke-width="1"/>
  <rect x="418" y="290" width="5"   height="46" rx="2" fill="#58a6ff"/>
  <text x="436" y="309" fill="#8b949e" font-size="11">story : "Sigurd navigua…"</text>
  <text x="436" y="327" fill="#58a6ff" font-size="11" font-weight="600">score : 0.35</text>

  <!-- ↓ arrow -->
  <line x1="408" y1="338" x2="408" y2="350" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="408,358 403,349 413,349" fill="#30363d"/>

  <!-- ── style-editor tour 1 ── -->
  <rect x="34" y="359" width="336" height="46" rx="5" fill="#1c2128" stroke="#ff6b3533" stroke-width="1"/>
  <rect x="34" y="359" width="5"   height="46" rx="2" fill="#ff6b35"/>
  <text x="52"  y="378" fill="#ff6b35" font-size="11" font-weight="600">style-editor  (tour 1)</text>
  <text x="52"  y="396" fill="#8b949e" font-size="10">outputKey = "story"  — lit scope["story"] + scope["style"]</text>

  <rect x="418" y="359" width="428" height="46" rx="4" fill="#1c2128" stroke="#ff6b3522" stroke-width="1"/>
  <rect x="418" y="359" width="5"   height="46" rx="2" fill="#ff6b35"/>
  <text x="436" y="378" fill="#ff6b35" font-size="11" font-weight="600">story : "Sigurd, fils du tonnerre…"</text>
  <text x="436" y="396" fill="#8b949e" font-size="11">score : 0.35</text>

  <!-- ── ellipsis ── -->
  <line x1="408" y1="407" x2="408" y2="415" stroke="#30363d" stroke-width="1.5"/>
  <text x="205" y="431" text-anchor="middle" fill="#6e7681" font-size="18">· · ·</text>
  <text x="632" y="431" text-anchor="middle" fill="#6e7681" font-size="18">· · ·</text>
  <line x1="408" y1="437" x2="408" y2="445" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="408,453 403,444 413,444" fill="#30363d"/>

  <!-- ── style-scorer last (score ≥ 0.8) ── -->
  <rect x="34" y="455" width="336" height="46" rx="5" fill="#1c2128" stroke="#3fb95055" stroke-width="1"/>
  <rect x="34" y="455" width="5"   height="46" rx="2" fill="#3fb950"/>
  <text x="52"  y="474" fill="#3fb950" font-size="11" font-weight="600">style-scorer  (tour N) — score ≥ 0.8  ✓</text>
  <text x="52"  y="492" fill="#8b949e" font-size="10">outputKey = "score"  → superviseur s'arrête</text>

  <rect x="418" y="455" width="428" height="46" rx="4" fill="#1c2128" stroke="#3fb95033" stroke-width="1"/>
  <rect x="418" y="455" width="5"   height="46" rx="2" fill="#3fb950"/>
  <text x="436" y="474" fill="#8b949e" font-size="11">story : "Sous la fureur d'Odin…"</text>
  <text x="436" y="492" fill="#3fb950" font-size="11" font-weight="600">score : 0.85  ✓</text>

  <!-- ↓ arrow -->
  <line x1="408" y1="503" x2="408" y2="513" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="408,521 403,512 413,512" fill="#30363d"/>

  <!-- ── supervisor stops — no outputKey ── -->
  <rect x="34" y="523" width="336" height="27" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="202" y="541" text-anchor="middle" fill="#6e7681" font-size="10">superviseur retourne "0.85" (LAST) — aucun outputKey → scope inchangé</text>

  <rect x="418" y="523" width="428" height="27" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="436" y="541" fill="#8b949e" font-size="11">story : "Sous la fureur d'Odin…"    score : 0.85</text>

  <!-- /SUPERVISOR -->

  <!-- ↓ arrow -->
  <line x1="408" y1="552" x2="408" y2="562" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="408,570 403,561 413,561" fill="#30363d"/>

  <!-- ── sequence ends — no outputKey ── -->
  <rect x="24" y="573" width="358" height="27" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="203" y="591" text-anchor="middle" fill="#6e7681" font-size="10">séquence termine — aucun outputKey → scope inchangé</text>

  <rect x="418" y="573" width="428" height="27" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="436" y="591" fill="#8b949e" font-size="11">story : "Sous la fureur d'Odin…"    score : 0.85</text>

  <!-- /SEQUENCE -->

  <!-- ↓ arrow -->
  <line x1="408" y1="608" x2="408" y2="620" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="408,628 403,619 413,619" fill="#30363d"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- ENDPOINT reads scope                             -->
  <!-- ════════════════════════════════════════════════ -->
  <rect x="12" y="631" width="382" height="58" rx="5" fill="#21262d" stroke="#d2992255" stroke-width="1.5"/>
  <text x="203" y="650" text-anchor="middle" fill="#d29922" font-size="12" font-weight="700">StyledWriterEndpoint</text>
  <text x="203" y="666" text-anchor="middle" fill="#8b949e" font-size="10">scope.readState("story", "")</text>
  <text x="203" y="680" text-anchor="middle" fill="#8b949e" font-size="10">scope.readState("score", 0.0)</text>

  <rect x="418" y="631" width="428" height="58" rx="4" fill="#21262d" stroke="#d2992244" stroke-width="1.5"/>
  <text x="436" y="650" fill="#d29922" font-size="11" font-weight="700">← scope.readState("story", "")</text>
  <text x="436" y="666" fill="#ff6b35" font-size="11" font-weight="600">"Sous la fureur d'Odin…"  ✓</text>
  <text x="436" y="682" fill="#3fb950" font-size="11" font-weight="600">0.85  ✓</text>

  <!-- ════════════════════════════════════════════════ -->
  <!-- LEGEND — two rows                                -->
  <!-- ════════════════════════════════════════════════ -->
  <rect x="12" y="703" width="836" height="44" rx="4" fill="#161b22"/>
  <!-- Row 1 -->
  <rect x="24"  y="712" width="8" height="8" rx="2" fill="#ff6b35"/>
  <text x="37"  y="721" fill="#8b949e" font-size="10">écrit scope["story"]</text>
  <rect x="175" y="712" width="8" height="8" rx="2" fill="#58a6ff"/>
  <text x="188" y="721" fill="#8b949e" font-size="10">écrit scope["score"]</text>
  <rect x="330" y="712" width="8" height="8" rx="2" fill="#3fb950"/>
  <text x="343" y="721" fill="#8b949e" font-size="10">score ≥ 0.8 (arrêt)</text>
  <rect x="466" y="712" width="8" height="8" rx="2" fill="#d29922"/>
  <text x="479" y="721" fill="#8b949e" font-size="10">endpoint lit le scope</text>
  <!-- Row 2 -->
  <rect x="24"  y="730" width="8" height="8" rx="2" fill="#a371f7"/>
  <text x="37"  y="739" fill="#8b949e" font-size="10">planificateur lit le scope (@SupervisorRequest) — sans lui, le LLM voit une requête vide ''</text>

</svg>
